# GitHub Actions — workaround para Vercel Hobby (cron diario único).
# Llama a /api/cron/sync-matches (descarga ESPN) y luego a
# /api/cron/lock-and-score (cierra + puntúa).
#
# DISEÑO ANTI-THROTTLING: GitHub retrasa/descarta eventos schedule en cuentas
# free (observado: runs cada ~4h en vez de cada 10 min). Por eso cada run NO
# hace un solo ping: hace un BUCLE de pings cada 5 min durante ~55 min. Así,
# con que GitHub dispare UN evento por hora, la cobertura es casi continua.
# El grupo de concurrencia cancela el run anterior cuando arranca uno nuevo
# (no se apilan). El repo es público → minutos de Actions ilimitados.
#
# ACTIVACIÓN:
# 1. En el repo de GitHub → Settings → Secrets and variables → Actions → New repository secret.
#    Añadir:
#      - APP_URL          → https://quiniela.solint.cloud (sin barra final)
#      - CRON_SECRET      → el mismo valor que en Vercel Env (Production)
# 2. Hacer push de este archivo. El workflow se activa solo.
#
# ⚠️ APP_URL debe ser un host SIN redirect. Opciones válidas:
#    - https://quiniela.solint.cloud (recomendado, mismo host que la app móvil)
#    - https://www.quinielabox.com   (también vale, con www)
#    NO usar el apex https://quinielabox.com → redirige 307 a www y los
#    clientes HTTP estripean el header Authorization al seguir el redirect
#    (RFC standard), así que el endpoint recibe la petición sin auth y
#    devuelve 403 Forbidden.
#
# Si subes Vercel a Pro, puedes borrar este workflow y volver al cron nativo.

name: sync-and-score
on:
  schedule:
    # Solo BACKSTOP: la cadena auto-perpetuante (re-dispatch al final de cada
    # run) es el motor real. El schedule solo re-arranca la cadena si un run
    # muere. Cada 30 min basta y NO interrumpe tanto las pausas largas de las
    # horas muertas (el bucle adaptativo duerme hasta 25 min cuando idle).
    - cron: '7,37 * * * *'
  workflow_dispatch: {}     # permite ejecutarlo manual desde la UI
  push:
    branches: [main]        # cada deploy también arranca una hora de cobertura

concurrency:
  group: sync-and-score
  cancel-in-progress: true  # un run nuevo sustituye al viejo, no se apilan

permissions:
  actions: write   # para que el run pueda re-dispatcharse a si mismo (cadena)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Verificar secrets
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Faltan secrets APP_URL o CRON_SECRET — workflow no configurado."
            exit 1
          fi

      - name: Bucle adaptativo sync + lock-and-score (~45 min, luego re-dispatch)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Corre ~45 min y luego se re-dispatcha (cadena continua). El
          # intervalo es ADAPTATIVO: 5 min cuando hay partido cerca/en vivo,
          # 25 min en horas muertas. Asi Neon se SUSPENDE en los huecos y no
          # gastamos horas de computo 24/7 (free tier factura por tiempo activo).
          DEADLINE=$(( $(date +%s) + 2700 ))   # ~45 min de cobertura
          n=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            n=$((n+1))
            echo "═══ Ping $n · $(date -u +%H:%M:%SZ) ═══"

            echo "→ POST $APP_URL/api/cron/sync-matches"
            curl -sS --max-time 60 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/sync-matches" \
              -w "\nHTTP %{http_code}\n" || true

            echo "→ POST $APP_URL/api/cron/lock-and-score"
            RESP=$(curl -sS --max-time 60 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/lock-and-score" || true)
            echo "$RESP"

            # idle:true => nada cerca => dormir 25 min (deja suspender Neon).
            if printf '%s' "$RESP" | grep -q '"idle":true'; then
              WANT=1500
            else
              WANT=300
            fi

            REMAIN=$(( DEADLINE - $(date +%s) ))
            [ "$REMAIN" -le 5 ] && break
            [ "$WANT" -gt "$REMAIN" ] && WANT=$REMAIN
            echo "· durmiendo ${WANT}s (idle=$([ "$WANT" = 1500 ] && echo si || echo no))"
            sleep "$WANT"
          done

      # CADENA CONTINUA: al terminar el bucle, este run lanza el siguiente
      # via workflow_dispatch (GITHUB_TOKEN puede — es una de las excepciones
      # a la regla anti-recursion de GitHub). Asi la cobertura es 24/7 sin
      # depender del schedule, que GitHub throttlea sin piedad (observado:
      # gaps de 4h de madrugada → el Corea-Chequia tardo horas en puntuar).
      # El schedule queda como backstop para re-arrancar la cadena si un run
      # muere. Si este run fue cancelado por uno mas nuevo, el nuevo hereda
      # la cadena (por eso el if).
      - name: Encadenar siguiente run
        if: ${{ !cancelled() }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/lock-and-score.yml/dispatches" \
            -d '{"ref":"main"}' \
            -w "dispatch HTTP %{http_code}\n"
