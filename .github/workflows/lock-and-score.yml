# GitHub Actions — workaround para Vercel Hobby (cron diario único).
# Llama al endpoint /api/cron/lock-and-score cada 10 minutos.
# Gratis e ilimitado para repos privados de orgs (2000 min/mes incluidos).
#
# ACTIVACIÓN:
# 1. En el repo de GitHub → Settings → Secrets and variables → Actions → New repository secret.
#    Añadir:
#      - APP_URL          → https://quiniela-padelbox.vercel.app (sin barra final)
#      - CRON_SECRET      → el mismo valor que en Vercel Env
# 2. Hacer push de este archivo. El workflow se activa solo.
#
# Si subes Vercel a Pro, puedes borrar este workflow y volver al cron nativo.

name: lock-and-score
on:
  schedule:
    - cron: '*/10 * * * *'  # cada 10 min (GitHub puede retrasar ~10-20min en horas pico)
  workflow_dispatch: {}     # permite ejecutarlo manual desde la UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/lock-and-score
        run: |
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Faltan secrets APP_URL o CRON_SECRET — workflow no configurado."
            exit 1
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/lock-and-score" \
            -o /tmp/response.json
          cat /tmp/response.json
